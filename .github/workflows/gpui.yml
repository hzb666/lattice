name: GPUI

# The GPUI preview app in gpui/ is a Cargo workspace of its own, built from
# Zed's crates (about 1,200 of them), and nothing in the Tauri app depends on
# it. Its builds take 30-60 minutes a run, so pull requests and pushes to main
# do not run this workflow; the optional local `pnpm signoff`
# (docs/agent-validation.md) runs the GPUI unit tests and the e2e scenario
# when a change touches gpui/. It runs for a release tag, on demand (Actions > GPUI > Run
# workflow), and weekly on main, which is what keeps its Rust caches warm.
#
# The app builds on the backend crate it shares with the Tauri app
# (src-tauri/lattice-core). The other files outside gpui/ it reads are the
# design system's exports: gpui/crates/lattice-ui generates its tokens from
# tokens.json (Paper's) and its Zed editor themes from code-themes.json, and
# fails a test while either disagrees with what it generated.
# code-themes.json is in turn generated from the app's code themes
# (src/settings/code-themes.ts, with the contrast fitting in
# theme-customization.ts) by design-system/code-themes.mjs, and the
# code-themes job fails while the JSON is stale. The macos job also writes the
# parity report (gpui/parity/), which stages its scenes with
# design-system/screens/. The webview islands (gpui/islands/) are built from
# the Tauri app's own modules: the board, spreadsheet, presentation and
# Markdown editors in src/editor/, src/canvas/markdown-preview-sync.ts,
# src/editor/latex/latex-text.ts, and the app's styles, i18n and utilities.
on:
  push:
    tags: ["v*"]
  schedule:
    # Monday 06:41 UTC, away from the hour and from ci.yml's weekly run.
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: gpui-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: gpui

env:
  CARGO_TERM_COLOR: always
  # Incremental state is several GB that a fresh checkout never reuses.
  CARGO_INCREMENTAL: "0"
  # Zed's repository is large; the git CLI fetches it faster than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Everything builds in the release profile, as users run it: a dev build of
# Zed's assets crate reads its files from the Zed checkout at run time instead
# of embedding them, and finds none from this workspace. Cold, the release
# build took 31 minutes on macOS and 28 on Windows (2026-11-11); everything
# after it takes about two.
#
# The Rust caches are written from main only (the weekly run, or a dispatch
# there), and only when their key (the lockfile, the toolchain, this job)
# changes, because the repository's 10 GB Actions cache also holds the Tauri
# release cache that tag builds restore. A tag run reads main's cache and
# writes none, since a cache written from a tag is visible to that tag alone.
# They are written even when a test fails: the compiled crates are what the
# next run needs, and a red test does not make them wrong.
jobs:
  # The export imports only the two TypeScript modules, which import nothing
  # at run time, so Node alone runs it: no pnpm install.
  code-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches mise.toml's `node`; 22.18 and later run TypeScript.
          node-version: 22
      - run: node design-system/code-themes.mjs --check

  # gpui/patches holds upstream crates with Lattice's diffs; this rebuilds
  # them from upstream at their pins and fails unless they match.
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: script/check-patches

  # The e2e scenario has grown to about 550 steps: some 6 minutes on a
  # developer's Mac, and about 25 on the hosted runners (run 43979342348 was
  # cut off at 10 minutes a little past step 200 on macOS). Each job's limit
  # leaves room for a cold release build (about 30 minutes), the tests and a
  # 45-minute e2e.
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # Installs the release gpui/rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: script/fetch-pdfium
      - run: cargo build --release --locked
      # A small TeX Live on PATH, where the app looks first. scheme-basic has
      # no `synctex` binary (its own package, as in lattice-core's TeX Live
      # install), and the e2e scenario's SyncTeX steps run it.
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: false
          packages: |
            scheme-basic
            latexmk
            synctex
      # TexLab, for the editor's diagnostics, which the e2e scenario checks
      # (the Windows job has none and skips that step).
      - name: Install TexLab
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install texlab
      # --include-ignored runs the latexmk build test, which needs TeX.
      - run: cargo test --release --locked --workspace -- --include-ignored
      # lattice-core's entry check against real latexmk builds (the native
      # app's project entry): its TeX tests run where TeX is installed, and
      # lattice-core is not a member of this workspace.
      - run: cargo test --release --locked --manifest-path ../src-tauri/lattice-core/Cargo.toml --lib latex::build::current
      # gpui-webview's own tests (the vendored crate is not a workspace
      # member): the WebView2 cutouts' region arithmetic, on every platform.
      - run: cargo test --release --locked -p gpui-webview --lib
      # The scenario ends by quitting with text typed and not yet saved
      # (its result's `after_quit`); once the app has exited, the file must
      # hold that text. A PDF step that finds the window drawing no frames
      # captures the screen once, to show what was in front of it.
      # The editor-adapter steps wait for the window to paint carets, gutter
      # marks and cards. A CAMetalDisplayLink stops delivering frames once
      # the runner's display stops compositing the window, which left those
      # steps with nothing painted partway through; the lab switch
      # (patches/README.md) paces the window by the display's CVDisplayLink
      # and keeps it drawing.
      # The island pages the board, spreadsheet and deck checks open, built
      # from the Tauri app's modules (gpui/script/build-islands), which needs
      # the repository's node_modules; the parity report below reuses them.
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build the island pages
        run: script/build-islands
      - name: e2e scenario
        timeout-minutes: 45
        env:
          GPUI_LAB_IGNORE_OCCLUSION: "1"
          LATTICE_E2E_FRAMELESS_SHOT: ${{ runner.temp }}/e2e-macos-frameless.png
        run: |
          project="$RUNNER_TEMP/e2e-project"
          out="$RUNNER_TEMP/e2e-macos.json"
          cp -R fixtures/e2e "$project"
          # Typst support from a stand-in release on disk, as script/e2e
          # makes it (scenario/e2e/typst.rs installs it from there).
          node ../scripts/typst-helper-fake-release.mjs target/release/lattice-typst "$RUNNER_TEMP/typst-release"
          export LATTICE_E2E_TYPST_RELEASE="$RUNNER_TEMP/typst-release"
          # As on Windows: the builds, cleans and notices in the job's log.
          LATTICE_GPUI_LOG=info target/release/lattice-gpui "$project" --scenario e2e --out "$out"
          cat "$out"
          jq -e '.passed == true' "$out" > /dev/null
          file="$(jq -r '.after_quit.file' "$out")"
          grep -qF "$(jq -r '.after_quit.text' "$out")" "$file" || { echo "quitting did not save $file"; exit 1; }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-macos
          path: |
            ${{ runner.temp }}/e2e-macos.json
            ${{ runner.temp }}/e2e-macos-frameless.png
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: gpui
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: script/fetch-pdfium.ps1
      - run: cargo build --release --locked
      # MiKTeX's latexmk is a Perl script; the runner's Strawberry Perl runs
      # it. Packages the documents need are installed on first use, without
      # the prompt a desktop install shows.
      #
      # Downloading and installing MiKTeX took several minutes a run and once
      # failed the job on the download's timeout, so the installed tree (its
      # common install, config and data, plus the per-user formats and
      # packages it fetches on first use) is cached. The key's version is
      # bumped by hand to pick up a newer MiKTeX; a restored tree that no
      # longer runs falls back to a fresh install.
      - name: Restore MiKTeX
        id: miktex-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            C:\Program Files\MiKTeX
            C:\ProgramData\MiKTeX
            ~\AppData\Local\MiKTeX
            ~\AppData\Roaming\MiKTeX
          key: miktex-${{ runner.os }}-v2
          restore-keys: miktex-${{ runner.os }}-
      - name: Install MiKTeX
        id: miktex
        timeout-minutes: 25
        run: |
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          $registry = "C:\ProgramData\MiKTeX\lattice-ci-registry"
          foreach ($file in @("$registry\hklm.reg", "$registry\hkcu.reg")) {
            if (Test-Path $file) {
              reg import $file
              if ($LASTEXITCODE -ne 0) { throw "Could not restore $file" }
            }
          }
          $restored = $false
          if (Test-Path "$bin\latexmk.exe") {
            & "$bin\latexmk.exe" --version
            $restored = $LASTEXITCODE -eq 0
          }
          if (-not $restored) {
            # choco retries nothing itself; the CTAN mirror it downloads from
            # stalls now and then.
            foreach ($attempt in 1..3) {
              choco install miktex --no-progress -y --execution-timeout=600
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "choco could not install MiKTeX" }
              Start-Sleep -Seconds 20
            }
            $bin = @("C:\Program Files\MiKTeX\miktex\bin\x64", "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64") |
              Where-Object { Test-Path "$_\initexmf.exe" } | Select-Object -First 1
            if (-not $bin) { throw "MiKTeX's binaries were not found after the install" }
            & "$bin\initexmf.exe" --admin --set-config-value=[MPM]AutoInstall=1
            & "$bin\miktex.exe" --admin packages update-package-database
            & "$bin\miktex.exe" --admin packages install latexmk
            & "$bin\latexmk.exe" --version
          }
          $added = $false
          if (-not (& "$bin\kpsewhich.exe" cmr10.pfb)) {
            foreach ($attempt in 1..3) {
              & "$bin\miktex.exe" --admin packages install amsfonts
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "MiKTeX could not install amsfonts" }
              Start-Sleep -Seconds (20 * $attempt)
            }
            & "$bin\initexmf.exe" --admin --update-fndb
            if (-not (& "$bin\kpsewhich.exe" cmr10.pfb)) { throw "cmr10.pfb is still missing" }
            $added = $true
          }
          New-Item -ItemType Directory -Force $registry | Out-Null
          foreach ($hive in @(@("HKLM", "hklm"), @("HKCU", "hkcu"))) {
            if (Test-Path "$($hive[0]):\SOFTWARE\MiKTeX.org") {
              reg export "$($hive[0])\SOFTWARE\MiKTeX.org" "$registry\$($hive[1]).reg" /y
              if ($LASTEXITCODE -ne 0) { throw "Could not cache MiKTeX registry settings" }
            }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $older = "${{ steps.miktex-cache.outputs.cache-matched-key }}" -ne "${{ steps.miktex-cache.outputs.cache-primary-key }}"
          "save=$((-not $restored) -or $added -or $older)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: cargo test --release --locked --workspace -- --include-ignored
      # gpui-webview's own tests (the vendored crate is not a workspace
      # member): the WebView2 cutouts' region arithmetic, on every platform.
      - run: cargo test --release --locked -p gpui-webview --lib
      # After the tests, so the packages and formats the documents fetched on
      # first use are in it. Saved only from main (a tag's cache is visible to
      # that tag alone) and only when this cache key needs updating.
      - name: Save MiKTeX
        if: ${{ !cancelled() && steps.miktex.outputs.save == 'True' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            C:\Program Files\MiKTeX
            C:\ProgramData\MiKTeX
            ~\AppData\Local\MiKTeX
            ~\AppData\Roaming\MiKTeX
          key: ${{ steps.miktex-cache.outputs.cache-primary-key }}
      # As on macOS: the island pages the board, spreadsheet, deck and
      # Markdown checks open. Without them every island reported "The island
      # pages are not built". Git Bash runs the script.
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build the island pages
        shell: bash
        run: script/build-islands
      # The scenario posts window messages, so it needs no foreground window
      # or unlocked console; the runner's session gives GPUI a window, and
      # Direct3D falls back to WARP without a GPU. The app gets 40 of the
      # step's 45 minutes, so a scenario that hangs is killed here, with its
      # log, rather than by the runner.
      - name: e2e scenario
        timeout-minutes: 45
        run: |
          $project = Join-Path $env:RUNNER_TEMP "e2e-project"
          $out = Join-Path $env:RUNNER_TEMP "e2e-windows.json"
          Copy-Item -Recurse fixtures/e2e $project
          $env:LATTICE_GPUI_LOG = "info"
          $env:RUST_BACKTRACE = "1"
          # The look shots the modules take (LATTICE_E2E_SHOTS), copied from
          # the screen, so a WebView2 page and what covers it show as they
          # are; kept as an artifact for a look review.
          $env:LATTICE_E2E_SHOTS = Join-Path $env:RUNNER_TEMP "e2e-shots"
          New-Item -ItemType Directory -Force $env:LATTICE_E2E_SHOTS | Out-Null
          # Typst support from a stand-in release on disk, as script/e2e
          # makes it on a Mac (scenario/e2e/typst.rs installs it from there).
          $typst = Join-Path $env:RUNNER_TEMP "typst-release"
          node ../scripts/typst-helper-fake-release.mjs target/release/lattice-typst.exe $typst
          if ($LASTEXITCODE -ne 0) { throw "could not make the stand-in Typst release" }
          $env:LATTICE_E2E_TYPST_RELEASE = $typst
          $app = Start-Process -FilePath target/release/lattice-gpui.exe `
            -ArgumentList $project, "--scenario", "e2e", "--out", $out `
            -NoNewWindow -PassThru
          if (-not $app.WaitForExit(2400000)) { $app.Kill(); throw "the e2e scenario did not finish in 40 minutes" }
          Get-Content $out
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "the e2e scenario failed" }
          # As on macOS: the text typed just before the scenario quit is saved.
          # The path is a verbatim one (\\?\D:\...), whose `?` Get-Content
          # would read as a wildcard, so .NET reads it.
          $quit = $result.after_quit
          if (-not [System.IO.File]::ReadAllText($quit.file).Contains($quit.text)) { throw "quitting did not save $($quit.file)" }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-windows
          path: |
            ${{ runner.temp }}/e2e-windows.json
            ${{ runner.temp }}/e2e-shots/*.png
          if-no-files-found: ignore
          retention-days: 14
      # The native app for Windows as an unsigned archive: the binary, the
      # Typst helper, PDFium and the island pages side by side, as
      # structured/resources.rs looks for them. Not a release: nothing is
      # signed or published.
      - name: Pack the archive
        if: ${{ !cancelled() }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "lattice-gpui-windows-x86_64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/lattice-gpui.exe, target/release/lattice-typst.exe, vendor/pdfium/win-x64/bin/pdfium.dll, LICENSE $stage
          Copy-Item -Recurse islands/dist (Join-Path $stage "islands")
          Compress-Archive -Path $stage -DestinationPath (Join-Path $env:RUNNER_TEMP "lattice-gpui-windows-x86_64.zip")
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lattice-gpui-windows-x86_64
          path: ${{ runner.temp }}/lattice-gpui-windows-x86_64.zip
          if-no-files-found: ignore
          retention-days: 14

  # The native app on Linux: built, unit-tested, launched under Xvfb, and
  # kept as an unsigned archive (the binary, the Typst helper, PDFium and the
  # island pages, laid out side by side as structured/resources.rs looks for
  # them). Not a release: nothing here is signed or published, and it has no
  # e2e scenario yet (the scenario's native input is macOS and Windows only).
  #
  # Ubuntu 22.04, as the Tauri app's AppImage, so the archive runs on that
  # glibc and later. gpui_linux needs Zed's X11, Wayland, xkbcommon, ALSA and
  # Vulkan headers; gpui-webview needs WebKitGTK and GTK 3. Under Xvfb, Mesa's
  # lavapipe stands in for a GPU. The webview islands embed WebKitGTK in an
  # X11 child window (gpui-webview's README), which Xvfb is.
  linux:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gpui != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # A cold release build of Zed's crates takes most of the runner's free
      # disk; the preinstalled SDKs it never uses go first.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install the Linux build dependencies
        timeout-minutes: 15
        working-directory: .
        run: >-
          .github/scripts/apt-install.sh
          build-essential clang cmake pkg-config
          libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libsqlite3-dev
          libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          libvulkan1 mesa-vulkan-drivers
          libgtk-3-dev libwebkit2gtk-4.1-dev
          xvfb
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          # Restore only: the repository's Actions cache is at its 10 GB
          # limit, and a third multi-GB GPUI cache from main would evict the
          # Tauri release caches tag builds restore. Saved once Linux ships.
          save-if: false
      - run: script/fetch-pdfium
      - run: cargo build --release --locked
      # Without TeX, so the ignored latexmk build test stays ignored.
      - run: cargo test --release --locked --workspace
      # gpui-webview's own tests (the vendored crate is not a workspace
      # member): the WebView2 cutouts' region arithmetic, on every platform.
      - run: cargo test --release --locked -p gpui-webview --lib
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build the island pages
        run: script/build-islands
      - name: Stage the archive
        run: |
          stage="$RUNNER_TEMP/lattice-gpui-linux-x86_64"
          mkdir -p "$stage"
          cp target/release/lattice-gpui target/release/lattice-typst "$stage/"
          cp vendor/pdfium/linux-x64/lib/libpdfium.so "$stage/"
          cp -R islands/dist "$stage/islands"
          cp LICENSE "$stage/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      # From the staged copy, so the smoke also proves the archive's layout:
      # PDFium and the islands beside the binary, nothing read from the
      # checkout. The app must open its window on the e2e fixture and stay up.
      # No screenshot yet: lavapipe's frames read back black from X11 (both
      # the root and the app's own ARGB window), so the Linux look comes with
      # the e2e harness, which draws offscreen.
      - name: Launch smoke
        timeout-minutes: 5
        run: |
          project="$RUNNER_TEMP/smoke-project"
          cp -R fixtures/e2e "$project"
          log="$RUNNER_TEMP/linux-smoke.log"
          status=0
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            LATTICE_GPUI_LOG=info "$0/lattice-gpui" "$1" >"$2" 2>&1 &
            app=$!
            sleep 30
            if ! kill -0 "$app" 2>/dev/null; then
              wait "$app"; echo "the app exited with $? within 30 seconds"; exit 1
            fi
            kill -TERM "$app"
            wait "$app" || true
          ' "$STAGE" "$project" "$log" || status=$?
          tail -n 80 "$log"
          # PDFium from the archive, not the checkout's vendor/pdfium.
          if [ "$status" -eq 0 ] && ! grep -q "PDFium loaded from $STAGE/libpdfium.so" "$log"; then
            echo "PDFium did not load from the staged archive"
            status=1
          fi
          exit $status
      - name: Pack the archive
        if: ${{ !cancelled() }}
        run: tar -czf "$RUNNER_TEMP/lattice-gpui-linux-x86_64.tar.gz" -C "$RUNNER_TEMP" lattice-gpui-linux-x86_64
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lattice-gpui-linux-x86_64
          path: |
            ${{ runner.temp }}/lattice-gpui-linux-x86_64.tar.gz
            ${{ runner.temp }}/linux-smoke.log
          if-no-files-found: ignore
          retention-days: 14
