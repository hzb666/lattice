[workspace]
members = ["crates/chemex-cdxml", "crates/chemex-chemdraw", "crates/chemex-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
chemex-cdxml = { path = "crates/chemex-cdxml" }
chemex-chemdraw = { path = "crates/chemex-chemdraw" }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
